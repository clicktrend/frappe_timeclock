name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check timeclock
      - run: ruff format --check timeclock

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  server-tests:
    name: Server tests (Frappe v16 + HRMS)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - uses: actions/checkout@v4
        with:
          path: apps/timeclock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install bench
        run: pip install frappe-bench

      - name: Init bench (frappe version-16)
        run: |
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch version-16 frappe-bench
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000

      - name: Install apps (erpnext, hrms, timeclock)
        working-directory: frappe-bench
        run: |
          bench get-app --skip-assets --branch version-16 erpnext https://github.com/frappe/erpnext
          bench get-app --skip-assets --branch version-16 hrms https://github.com/frappe/hrms
          bench get-app --skip-assets timeclock "${GITHUB_WORKSPACE}/apps/timeclock"

      - name: Create site
        working-directory: frappe-bench
        run: |
          bench new-site test.localhost \
            --db-root-password root \
            --admin-password admin \
            --mariadb-user-host-login-scope='%'
          bench --site test.localhost install-app erpnext hrms timeclock

      - name: Run tests
        working-directory: frappe-bench
        run: bench --site test.localhost run-tests --app timeclock
